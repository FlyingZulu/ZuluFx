name: Keystore debug

on:
  push:
    paths:
      - '.github/workflows/keystore-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Tester le keystore PKCS12
        run: |
          set +e
          keytool -list -v -storetype PKCS12 -keystore signing/zulu.p12 -storepass zuluzulu2000
          echo "EXIT=$?"

      - name: Regenerer en PKCS12 natif Java si besoin
        run: |
          set +e
          keytool -list -storetype PKCS12 -keystore signing/zulu.p12 -storepass zuluzulu2000 >/dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "Le keystore PKCS12 est lisible par Java, rien a faire."
            exit 0
          fi
          echo "Keystore illisible par Java : regeneration native."
          rm -f signing/zulu.p12
          keytool -genkeypair -v -storetype PKCS12 -keystore signing/zulu.p12 \
            -alias zulu -storepass zuluzulu2000 -keypass zuluzulu2000 \
            -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=Zulu"
          git config user.name "Vibe Nuage Agent"
          git config user.email "vibe@mistral.ai"
          git add signing/zulu.p12
          git commit -m "keystore PKCS12 genere nativement par keytool (compatible Java)"
          git push
