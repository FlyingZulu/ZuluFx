plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zulu'
    compileSdk 34

    signingConfigs {
        zulu {
            storeFile rootProject.file('signing/zulu.p12')
            storeType 'PKCS12'
            storePassword 'zuluzulu2000'
            keyAlias 'zulu'
            keyPassword 'zuluzulu2000'
        }
    }

    defaultConfig {
        applicationId "com.zulu"
        minSdk 24
        targetSdk 33
        versionCode 35
        versionName "0.35"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }
    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt" }
    }
    buildFeatures { prefab true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        debug {
            signingConfig signingConfigs.zulu
        }
        release {
            signingConfig signingConfigs.zulu
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.oboe:oboe:1.10.0'
}
